<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Dark rounded background -->
  <rect width="32" height="32" rx="7" fill="#0f172a"/>
  <!-- Subtle gradient overlay -->
  <rect width="32" height="32" rx="7" fill="url(#grad)" opacity="0.6"/>

  <!-- Grid lines subtle -->
  <line x1="4" y1="24" x2="28" y2="24" stroke="#334155" stroke-width="0.5"/>
  <line x1="4" y1="17" x2="28" y2="17" stroke="#334155" stroke-width="0.4" stroke-dasharray="2 2"/>

  <!-- Axes -->
  <path d="M5 5 L5 25 L27 25" stroke="#475569" stroke-width="1" stroke-linecap="round"/>

  <!-- Historical trend line (solid) -->
  <polyline
    points="7,22 10,20 13,18 16,16"
    stroke="#94a3b8"
    stroke-width="1.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Forecast line (dashed emerald) -->
  <polyline
    points="16,16 19,13 22,10 25,8"
    stroke="#10b981"
    stroke-width="1.8"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-dasharray="2.5 1.5"
    fill="none"
  />

  <!-- Forecast endpoint node (glowing) -->
  <circle cx="25" cy="8" r="2.5" fill="#10b981"/>
  <circle cx="25" cy="8" r="4" fill="#10b981" opacity="0.2"/>

  <!-- Connection point (split between hist and forecast) -->
  <circle cx="16" cy="16" r="1.8" fill="#6366f1"/>
  <circle cx="16" cy="16" r="3" fill="#6366f1" opacity="0.2"/>

  <!-- AI Spark / Star at top left -->
  <path d="M9 9 L9.7 10.5 L11.2 11.2 L9.7 11.9 L9 13.4 L8.3 11.9 L6.8 11.2 L8.3 10.5 Z"
    fill="#f59e0b" opacity="0.9"/>

  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.15"/>
    </linearGradient>
  </defs>
</svg>
